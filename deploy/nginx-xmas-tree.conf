# Christmas tree site:
# - HTTPS on 8444 (LAN / direct TLS; required by browsers for webcam hand-tracking)
# - HTTP on 127.0.0.1:8084 (backend target for SakuraFRP auto-HTTPS tunnel)

server {
    listen 8444 ssl http2;
    listen [::]:8444 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/xmas-tree.crt;
    ssl_certificate_key /etc/nginx/ssl/xmas-tree.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/xmas-tree/web;
    index index.html;
    client_max_body_size 16m;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json application/wasm application/octet-stream;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass         http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
    }

    location /photos/ {
        alias /var/www/xmas-tree/data/photos/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Pre-compressed immutable vendor assets (.mjs / .wasm / .task) with exact MIME types
    location ~* ^/vendor/.*\.mjs$   { types { } default_type text/javascript;          expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* ^/vendor/.*\.wasm$  { types { } default_type application/wasm;         expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* ^/vendor/.*\.task$  { types { } default_type application/octet-stream; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* ^/vendor/.*\.woff2$ { types { } default_type font/woff2;               expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /vendor/              { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 127.0.0.1:8084;
    server_name _;

    root  /var/www/xmas-tree/web;
    index index.html;
    client_max_body_size 16m;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json application/wasm application/octet-stream;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass         http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
    }

    location /photos/ {
        alias /var/www/xmas-tree/data/photos/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* ^/vendor/.*\.mjs$   { types { } default_type text/javascript;          expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* ^/vendor/.*\.wasm$  { types { } default_type application/wasm;         expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* ^/vendor/.*\.task$  { types { } default_type application/octet-stream; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* ^/vendor/.*\.woff2$ { types { } default_type font/woff2;               expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /vendor/              { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
